name: E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Tunnel creation is rate limited per Cloudflare account, not per branch, so only let
# one e2e run talk to Cloudflare at a time. Queue rather than cancel: a cancelled run
# leaves the tunnel it created behind.
concurrency:
  group: e2e-cloudflare-tunnel
  cancel-in-progress: false

env:
  GO_VERSION: "1.24"
  KIND_VERSION: "v0.25.0"
  KUBECTL_VERSION: "v1.31.0"
  GATEWAY_API_VERSION: "v1.4.0"

jobs:
  check-changes:
    name: Check for Code Changes
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.github/workflows/build-image-reusable.yaml'

  build-image:
    name: Build Controller Image
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    uses: ./.github/workflows/build-image-reusable.yaml
    permissions:
      contents: read
      packages: write
    with:
      push: true
      platforms: linux/amd64
      tags: |
        type=ref,event=pr
        type=ref,event=branch
        type=sha

  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-changes, build-image]
    if: always() && !cancelled() && !failure()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate E2E test identifier
        id: e2e-id
        run: |
          echo "E2E_ID=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create kind cluster
        run: |
          cat <<EOF | kind create cluster --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: cloudflare-gateway-e2e
          nodes:
          - role: control-plane
            image: kindest/node:v1.31.0
          - role: worker
            image: kindest/node:v1.31.0
          EOF

          kubectl cluster-info
          kubectl get nodes

      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/${{ env.GATEWAY_API_VERSION }}/standard-install.yaml
          kubectl wait --for condition=established --timeout=60s crd/gatewayclasses.gateway.networking.k8s.io
          kubectl wait --for condition=established --timeout=60s crd/gateways.gateway.networking.k8s.io
          kubectl wait --for condition=established --timeout=60s crd/httproutes.gateway.networking.k8s.io

      - name: Pull and load Docker image into kind
        run: |
          # Use the newly built image if available, otherwise use the branch tag
          if [ "${{ needs.check-changes.outputs.should-build }}" == "true" ]; then
            IMAGE_TAG="${{ needs.build-image.outputs.image-tag }}"
          else
            # Use branch name or PR number as fallback
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
            else
              IMAGE_TAG="${{ github.ref_name }}"
            fi
          fi

          echo "Using image: ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

          docker pull "ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          kind load docker-image "ghcr.io/${{ github.repository }}:${IMAGE_TAG}" --name cloudflare-gateway-e2e

      - name: Install controller with kustomize
        run: |
          # Use the newly built image if available, otherwise use the branch tag
          if [ "${{ needs.check-changes.outputs.should-build }}" == "true" ]; then
            IMAGE_TAG="${{ needs.build-image.outputs.image-tag }}"
          else
            # Use branch name or PR number as fallback
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
            else
              IMAGE_TAG="${{ github.ref_name }}"
            fi
          fi

          # Overlay on config/default that points at the image built for this run.
          mkdir -p config/e2e
          cat > config/e2e/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization

          resources:
            - ../default

          images:
            - name: ghcr.io/georgepstaylor/cloudflare-gateway-controller
              newName: ghcr.io/${{ github.repository }}
              newTag: ${IMAGE_TAG}
          EOF

          kubectl kustomize config/e2e
          kubectl apply -k config/e2e

          kubectl create secret generic cloudflare-credentials \
            --namespace cloudflare-gateway-system \
            --from-literal=api-token="${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --from-literal=account-id="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

          kubectl rollout status deployment/cloudflare-gateway-controller \
            --namespace cloudflare-gateway-system --timeout=2m

      - name: Verify controller is running
        run: |
          kubectl get pods -n cloudflare-gateway-system
          kubectl logs -n cloudflare-gateway-system -l app.kubernetes.io/name=cloudflare-gateway-controller --tail=50

      - name: Create test namespace
        run: |
          kubectl create namespace hello-world

      - name: Create GatewayClass
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: cloudflare-${{ steps.e2e-id.outputs.E2E_ID }}
          spec:
            controllerName: george.dev/cloudflare-gateway-controller
            parametersRef:
              group: ""
              kind: Secret
              name: cloudflare-credentials
              namespace: cloudflare-gateway-system
          EOF

      - name: Wait for GatewayClass to be accepted
        run: |
          timeout 60s bash -c 'until kubectl get gatewayclass cloudflare-${{ steps.e2e-id.outputs.E2E_ID }} -o jsonpath="{.status.conditions[?(@.type==\"Accepted\")].status}" | grep -q "True"; do sleep 2; done' || ACCEPTED_FAILED=1
          kubectl get gatewayclass cloudflare-${{ steps.e2e-id.outputs.E2E_ID }} -o yaml
          if [ -n "${ACCEPTED_FAILED:-}" ]; then
            echo "::error::GatewayClass was not Accepted - the controller could not validate the Cloudflare credentials"
            kubectl logs -n cloudflare-gateway-system -l app.kubernetes.io/name=cloudflare-gateway-controller --tail=50
            exit 1
          fi

      - name: Create Gateway
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: hello-world-gateway-${{ steps.e2e-id.outputs.E2E_ID }}
            namespace: cloudflare-gateway-system
          spec:
            gatewayClassName: cloudflare-${{ steps.e2e-id.outputs.E2E_ID }}
            listeners:
              - name: http
                protocol: HTTP
                port: 80
          EOF

      - name: Wait for Gateway to be programmed
        run: |
          timeout 60s bash -c 'until kubectl get gateway hello-world-gateway-${{ steps.e2e-id.outputs.E2E_ID }} -n cloudflare-gateway-system -o jsonpath="{.status.conditions[?(@.type==\"Programmed\")].status}" | grep -q "True"; do sleep 2; done' || PROGRAMMED_FAILED=1
          kubectl get gateway hello-world-gateway-${{ steps.e2e-id.outputs.E2E_ID }} -n cloudflare-gateway-system -o yaml
          if [ -n "${PROGRAMMED_FAILED:-}" ]; then
            echo "::error::Gateway was not Programmed - the Cloudflare Tunnel was not created"
            kubectl logs -n cloudflare-gateway-system -l app.kubernetes.io/name=cloudflare-gateway-controller --tail=50
            exit 1
          fi

      - name: Deploy test application
        run: |
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: hello-world
            namespace: hello-world
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: hello-world
            template:
              metadata:
                labels:
                  app: hello-world
              spec:
                containers:
                - name: hello-world
                  image: gcr.io/google-samples/hello-app:1.0
                  ports:
                    - containerPort: 8080
                      name: http
                  env:
                    - name: PORT
                      value: "8080"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: hello-world
            namespace: hello-world
          spec:
            selector:
              app: hello-world
            ports:
            - protocol: TCP
              port: 8080
              targetPort: 8080
          EOF

      - name: Wait for application to be ready
        run: |
          kubectl wait --for=condition=available --timeout=120s \
            deployment/hello-world -n hello-world
          kubectl get pods -n hello-world

      - name: Create HTTPRoute
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: hello-world-${{ steps.e2e-id.outputs.E2E_ID }}
            namespace: hello-world
          spec:
            parentRefs:
              - name: hello-world-gateway-${{ steps.e2e-id.outputs.E2E_ID }}
                namespace: cloudflare-gateway-system
            hostnames:
              - "cfgwc.george.dev"
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: hello-world
                    port: 8080
          EOF

      - name: Wait for HTTPRoute to be accepted
        run: |
          timeout 60s bash -c 'until kubectl get httproute hello-world-${{ steps.e2e-id.outputs.E2E_ID }} -n hello-world -o jsonpath="{.status.parents[0].conditions[?(@.type==\"Accepted\")].status}" | grep -q "True"; do sleep 2; done' || ROUTE_FAILED=1
          kubectl get httproute hello-world-${{ steps.e2e-id.outputs.E2E_ID }} -n hello-world -o yaml
          if [ -n "${ROUTE_FAILED:-}" ]; then
            echo "::error::HTTPRoute was not Accepted"
            kubectl logs -n cloudflare-gateway-system -l app.kubernetes.io/name=cloudflare-gateway-controller --tail=50
            exit 1
          fi

      - name: Wait for route to be configured in tunnel
        run: |
          echo "Waiting for tunnel config to be updated with route..."
          timeout 60s bash -c 'until kubectl get configmap hello-world-gateway-${{ steps.e2e-id.outputs.E2E_ID }}-tunnel-config -n cloudflare-gateway-system -o jsonpath="{.data.config\.yaml}" | grep -q "cfgwc.george.dev"; do sleep 2; done'

          # The backend URL must stay partially qualified so cloudflared's resolv.conf
          # search path completes it - an explicit cluster domain would be a regression.
          CONFIG=$(kubectl get configmap hello-world-gateway-${{ steps.e2e-id.outputs.E2E_ID }}-tunnel-config \
            -n cloudflare-gateway-system -o jsonpath="{.data.config\.yaml}")
          echo "$CONFIG"
          if ! grep -q "http://hello-world.hello-world.svc:8080" <<<"$CONFIG"; then
            echo "::error::tunnel config does not contain the expected service URL"
            exit 1
          fi

          echo "Restarting cloudflared to pick up new configuration..."
          kubectl delete pods -n cloudflare-gateway-system -l app=cloudflared

          echo "Waiting for tunnel connections to establish..."
          sleep 30

      - name: Verify resources are created
        run: |
          kubectl get gatewayclass cloudflare-${{ steps.e2e-id.outputs.E2E_ID }} -o yaml
          kubectl get gateway hello-world-gateway-${{ steps.e2e-id.outputs.E2E_ID }} -n cloudflare-gateway-system -o yaml
          kubectl get httproute hello-world-${{ steps.e2e-id.outputs.E2E_ID }} -n hello-world -o yaml

      - name: Check controller health
        run: |
          kubectl get pods -n cloudflare-gateway-system -o wide

      - name: Test internal service connectivity
        run: |
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -n hello-world -- \
            curl --fail --silent --show-error http://hello-world.hello-world.svc.cluster.local:8080

      - name: Test public access to application
        run: |
          curl --fail --silent --show-error https://cfgwc.george.dev

      - name: Export logs
        if: always()
        run: |
          echo "=== Controller logs ==="
          kubectl logs -n cloudflare-gateway-system -l app.kubernetes.io/name=cloudflare-gateway-controller --tail=100 || true

          echo -e "\n=== Cloudflared logs ==="
          kubectl logs -n cloudflare-gateway-system -l app=cloudflared --tail=50 || true

          echo -e "\n=== Gateway resources ==="
          kubectl get gatewayclasses,gateways,httproutes --all-namespaces -o yaml || true

      - name: Cleanup Resources
        if: always()
        run: |
          # --wait=false: the controller finalizes Gateways and HTTPRoutes, so if it
          # cannot reach Cloudflare these deletes block until the job times out.
          kubectl delete namespace hello-world --ignore-not-found=true --wait=false || true
          kubectl delete -k config/e2e --ignore-not-found=true --wait=false || true

      - name: Cleanup Cluster
        if: always()
        run: |
          kind delete cluster --name cloudflare-gateway-e2e || true
